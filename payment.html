<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - Excoders Elite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#07070a;color:#fff;font-family:Arial;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.top b{font-size:20px;font-weight:900} .step{font-size:11px;color:#666}
.order{background:linear-gradient(135deg,#12121a,#0f0f18);border:1px solid #222;border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;margin:8px 0;font-size:13px}.dim{color:#777}.total{font-size:18px;font-weight:900;border-top:1px solid #222;padding-top:10px;margin-top:10px}
.input{width:100%;padding:13px;background:#0e0e14;border:1px solid #2a2a35;border-radius:10px;color:#fff;margin-bottom:12px;outline:none}
.input:focus{border-color:#a855f7}
.label{font-size:11px;color:#888;margin:12px 0 6px;display:block;letter-spacing:1px}
.m{border:1px solid #2a2a35;background:#12121a;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:10px}
.m.active{border-color:#a855f7;background:#181826}
.m b{font-size:13px}.m p{font-size:11px;color:#777}
.badge{font-size:9px;background:#222;padding:3px 7px;border-radius:20px}
.btn{width:100%;padding:16px;background:#fff;color:#000;border:none;border-radius:14px;font-weight:900;margin-top:18px}
</style>
</head>
<body>
<div class="top"><b>EXCODERS <span style="color:#a855f7">ELITE.</span></b><span class="step">STEP 2/2 • CHECKOUT</span></div>
<div class="order">
<div class="row"><span class="dim">Program</span><span>ELITE Membership</span></div>
<div class="row"><span class="dim">Price</span><span>$5.00</span></div>
<div class="row total"><span>Total</span><span style="color:#a855f7">$5.00</span></div>
</div>
<span class="label">REGISTRATION DETAILS</span>
<input class="input" id="name" placeholder="Full Name">
<input class="input" id="email" placeholder="Email Address">
<input class="input" id="user" placeholder="Desired Username">
<span class="label">PAYMENT METHOD</span>
<div class="m active" id="m1" onclick="pick('gift')"><div><b>🎁 Razer Gold Gift Card</b><p>$5 Gift Card</p></div><span class="badge">FAST</span></div>
<div class="m" id="m2" onclick="pick('direct')"><div><b>🏦 Direct Payment</b><p>Message for bank details</p></div><span class="badge">DM</span></div>
<div class="m" style="opacity:0.5"><div><b>💳 Paystack</b><p>Coming Soon</p></div><span class="badge">SOON</span></div>
<button class="btn" onclick="checkout()">COMPLETE - $5 →</button>
<script>
let method='Razer Gold Gift Card ($5)';
function pick(t){
 document.getElementById('m1').classList.remove('active');
 document.getElementById('m2').classList.remove('active');
 if(t=='gift'){document.getElementById('m1').classList.add('active');method='Razer Gold Gift Card ($5)';}
 if(t=='direct'){document.getElementById('m2').classList.add('active');method='Direct Payment ($5)';}
}
function checkout(){
 let n=document.getElementById('name').value;
 let e=document.getElementById('email').value;
 let u=document.getElementById('user').value;
 if(!n||!e||!u){alert('Fill all fields');return}
 let msg=`🔥 NEW ELITE REGISTRATION 🔥%0AName: ${n}%0AEmail: ${e}%0AUsername: ${u}%0AMethod: ${method}%0AAmount: $5%0A%0AI want to pay $5 via ${method}`;
 window.open(`https://wa.me/2349113257933?text=${msg}`,'_blank');
 document.body.innerHTML=`<div style="background:#07070a;color:#fff;font-family:Arial;padding:40px 20px;text-align:center;min-height:100vh"><h1>VERIFYING <span style="color:#a855f7">PAYMENT...</span></h1><p style="color:#888;margin-top:15px">We don receive your info.<br>Wait for +2349113257933 to verify your $5.<br>We go send Elite link after confirmation.</p><div style="margin-top:20px;padding:15px;background:#12121a;border:1px solid #222;border-radius:12px;text-align:left;font-size:13px">Name: ${n}<br>User: ${u}<br>Method: ${method}<br>Status: ⏳ Pending</div></div>`;
}
</script>
</body>
</html>
